services:
  - type: web
    name: forgetcheck
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: oregon
    branch: main
    healthCheckPath: /health
    disk:
      name: forgetcheck-data
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: PORT
        value: 10000
      - key: SECRET_KEY
        generateValue: true
      - key: INITIAL_ADMIN_USERNAME
        value: admin
      - key: INITIAL_ADMIN_PASSWORD
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
